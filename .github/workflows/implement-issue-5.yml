name: Implement issue 5

on:
  push:
    branches:
      - issue-5-idempotent-checkout

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-5-idempotent-checkout
          fetch-depth: 0

      - name: Apply implementation
        run: python scripts/implement_issue_5.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-issue-5.yml scripts/implement_issue_5.py
          git add backend frontend
          git commit -m "feat: unificar checkout atómico e idempotente (#5)"
          git push origin HEAD:issue-5-idempotent-checkout
